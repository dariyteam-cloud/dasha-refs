<!doctype html><html><head><meta charset="utf-8"><title>Референсы для съёмок</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root { color-scheme: dark; }
html, body { max-width:100%; overflow-x:hidden; }
body { background:#111; color:#eee; font-family:-apple-system,Segoe UI,Arial,sans-serif; margin:0; padding:24px; box-sizing:border-box; }
*, *::before, *::after { box-sizing:inherit; }
h1 { font-size:22px; margin:0 0 14px; }
.filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
.filters button { background:#1c1c1c; color:#7cc4ff; border:1px solid #333; border-radius:20px; padding:6px 14px; cursor:pointer; font-size:13px; }
.filters button.active { background:#7cc4ff; color:#111; font-weight:600; }
.grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; }
@media (max-width:1200px){ .grid{ grid-template-columns:repeat(3,minmax(0,1fr));} }
@media (max-width:800px){ .grid{ grid-template-columns:repeat(2,minmax(0,1fr));} }
@media (max-width:500px){ .grid{ grid-template-columns:minmax(0,1fr);} }
.card { background:#1c1c1c; border-radius:10px; padding:10px; display:flex; flex-direction:column; min-width:0; }
.card video { width:100%; border-radius:6px; background:#000; max-height:340px; object-fit:contain; }
.niche-badge { display:inline-block; font-size:11px; color:#111; background:#7cc4ff; border-radius:10px; padding:2px 8px; margin-bottom:6px; align-self:flex-start; }
.caption { font-size:12.5px; line-height:1.4; color:#ccc; margin-top:6px; white-space:pre-wrap; overflow-wrap:break-word; max-height:100px; overflow-y:auto; }
.date { font-size:11px; color:#888; margin-top:4px; }
.linkcard a { color:#7cc4ff; word-break:break-all; }
.empty { color:#888; font-size:14px; margin-top:20px; }
</style>
</head><body>
<h1>Референсы для съёмок</h1>
<div class="filters"><button data-niche="all" onclick="filterNiche('all')" class="active">Все</button><button data-niche="restaurant" onclick="filterNiche('restaurant')" class="">Ресторан</button><button data-niche="shop" onclick="filterNiche('shop')" class="">Магазин</button><button data-niche="cottage" onclick="filterNiche('cottage')" class="">Коттеджный посёлок</button><button data-niche="uncategorized" onclick="filterNiche('uncategorized')" class="">Без категории</button></div>
<div class="grid" id="grid">
<div class="card" data-niche="uncategorized">
<div class="niche-badge">Без категории</div>
<video controls preload="metadata" src="media/4.mp4"></video>
<div class="caption">​​Спасибо, что пользуетесь - @SaveAsBot&#x27;ом</div>
<div class="date">24.08.2026 00:45</div>
</div>
</div>

<script>
function filterNiche(key) {
  document.querySelectorAll('.filters button').forEach(function(b) {
    b.classList.toggle('active', b.dataset.niche === key);
  });
  document.querySelectorAll('.grid .card').forEach(function(c) {
    c.style.display = (key === 'all' || c.dataset.niche === key) ? '' : 'none';
  });
}
</script>
</body></html>
